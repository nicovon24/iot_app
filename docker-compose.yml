services:
  redis:
    image: redis:7-alpine
    container_name: iot_app_redis
    # Redis holds every active session token and the ThingsBoard service-account
    # JWT in plaintext, and 6379 is published to the host — so it is reachable by
    # anything on the machine, and on an open network by anything on the LAN.
    # The default keeps a fresh clone working with no extra setup; override
    # REDIS_PASSWORD (and REDIS_URL) for anything shared or deployed.
    command: redis-server --requirepass ${REDIS_PASSWORD:-devpassword}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      # Must authenticate too, or the container never reports healthy and
      # depends_on blocks the backend forever.
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-devpassword}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: iot_app_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: iot_app
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: iot_app-backend:local
    container_name: iot_app_backend
    env_file:
      - backend/.env
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:-devpassword}@redis:6379
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/iot_app
      FRONTEND_URL: http://localhost:3000
      # Overrides backend/.env's PORT so it always matches the 3001 port mapping below.
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      # No dedicated /health route; api/docs (Swagger) always responds once Nest is up.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/docs"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Baked into the JS bundle at build time (Next.js NEXT_PUBLIC_* vars are
        # not readable at runtime). Must be a URL reachable from the browser,
        # not the Docker-internal service name (e.g. NOT http://backend:3001).
        NEXT_PUBLIC_API_BASE_URL: http://localhost:3001
        NEXT_PUBLIC_WS_BASE_URL: ws://localhost:3001
    image: iot_app-frontend:local
    container_name: iot_app_frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  redis_data:
  postgres_data:
